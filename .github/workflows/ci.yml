name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs, so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Types
        run: npx tsc -p tsconfig-build.json --noEmit
      - name: Formatting
        run: npm run format:check
      - name: Translations
        run: node scripts/check-i18n.mjs
      - name: API requests (fake network, no keys)
        run: node scripts/check-api-requests.mjs
      - name: Update notice (fake network)
        run: node scripts/check-update-check.mjs
